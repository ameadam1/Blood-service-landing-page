    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

border:none;background:none;font:inherit;color:#102a43;cursor:pointer;padding:6px 0\">How it works<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goBranches }}\" style=\"appearance:none;border:none;background:none;font:inherit;color:#102a43;cursor:pointer;padding:6px 0\">Branches<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goFaq }}\" style=\"appearance:none;border:none;background:none;font:inherit;color:#102a43;cursor:pointer;padding:6px 0\">FAQs<\u002Fbutton>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ goFinder }}\" style=\"appearance:none;border:none;border-radius:6px;background:#0f6e56;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:11px 18px;cursor:pointer;white-space:nowrap\" style-hover=\"background:#0c5c47\">Find my test<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#f7f6f2\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:64px 24px 56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center\">\n      <div>\n        <h1 style=\"font-size:clamp(36px,5vw,54px);line-height:1.05;font-weight:700;letter-spacing:-.02em;color:#102a43;margin:0 0 18px;text-wrap:balance\">Private blood tests at your local pharmacy.<\u002Fh1>\n        <div style=\"font-size:17px;line-height:1.6;color:#4b5563;max-width:540px;margin-bottom:28px;text-wrap:pretty\">Quick, simple and local. Pick from 400+ tests, or answer a few questions and we'll suggest the right one. Results usually within a day, and we'll explain them if you'd like.<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goFinder }}\" style=\"appearance:none;border:none;border-radius:6px;background:#0f6e56;color:#fff;font:inherit;font-size:16px;font-weight:700;padding:15px 24px;cursor:pointer\" style-hover=\"background:#0c5c47\">Help me choose a test<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goTests }}\" style=\"appearance:none;border:1.5px solid #102a43;border-radius:6px;background:transparent;color:#102a43;font:inherit;font-size:16px;font-weight:700;padding:14px 22px;cursor:pointer\" style-hover=\"background:#fff\">See our tests and prices<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:#102a43;font-weight:600\">\n          <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#0f6e56\"><\u002Fspan>UKAS-accredited lab<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#0f6e56\"><\u002Fspan>Results usually in 1 day<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#0f6e56\"><\u002Fspan>Pay in store<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:16px;padding:26px 26px 22px;box-shadow:0 18px 40px rgba(16,42,67,.08)\">\n        <div style=\"font-size:13px;font-weight:700;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px\">Popular tests<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ heroPicks }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eeeeec\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:15px;font-weight:700;color:#102a43\">{{ h.n }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#6b7280;margin-top:2px\">{{ h.short }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:15px;font-weight:700;color:#102a43\">{{ h.price }}<\u002Fdiv><\u002Fsc-if>\n              <button type=\"button\" sc-camel-on-click=\"{{ h.toggle }}\" style=\"{{ h.btnStyle }}\">{{ h.btnLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ consultFirst }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:16px;background:#fff7e6;border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:#7a5400\">Not sure which test? Start with a phone consultation. Our team will call you, agree your tests and book you into your nearest branch.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"finder\" style=\"max-width:1200px;margin:0 auto;padding:64px 24px 24px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px\">\n      <div>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f6e56;margin-bottom:10px\">Find your test · about 2 minutes<\u002Fdiv>\n        <h2 style=\"font-size:34px;line-height:1.15;font-weight:700;color:#102a43;margin:0\">Not sure which test you need?<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#6b7280;max-width:380px;line-height:1.5\">Your answers go to the pharmacist before your appointment, so the consultation can focus on you.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n      <div style=\"flex:1 1 560px;min-width:0;background:#fff;border:1px solid #dfe0e0;border-radius:14px;overflow:hidden\">\n        <div style=\"display:flex;gap:4px;padding:14px 22px;border-bottom:1px solid #eeeeec;background:#fbfbfa;flex-wrap:wrap\">\n          <sc-for list=\"{{ progress }}\" as=\"pg\" hint-placeholder-count=\"6\">\n            <div style=\"{{ pg.style }}\">{{ pg.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:26px 26px 22px\">\n          <sc-if value=\"{{ isStop }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fcebeb;border:1px solid #f0cdcd;border-radius:12px;padding:22px 24px\">\n              <div style=\"font-size:12px;font-weight:700;color:#a32d2d;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px\">Please don't book a blood test today<\u002Fdiv>\n              <div style=\"font-size:20px;font-weight:700;color:#7c2626;line-height:1.3;margin-bottom:10px\">What you've told us needs to be looked at today, not in a few days.<\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:1.6;color:#7c2626;margin-bottom:14px\">A blood test result takes several days, so it isn't the right first step. Please speak to a doctor today.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:#1c1f23;margin-bottom:16px\">\n                <div><strong>Call 999<\u002Fstrong> if you have chest pain, struggle to breathe, have collapsed, or are vomiting blood.<\u002Fdiv>\n                <div><strong>Call NHS 111<\u002Fstrong> or your GP practice today for anything else on the list.<\u002Fdiv>\n                <div><strong>Pop in and speak to our pharmacist<\u002Fstrong> if you're unsure — no appointment needed.<\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ unstop }}\" style=\"appearance:none;border:1px solid #dfe0e0;border-radius:6px;background:#fff;color:#102a43;font:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;cursor:pointer\">Change my answer<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showStep }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-if value=\"{{ hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff7e6;border:1px solid #f0c36d;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:#7a5400;margin-bottom:18px\">{{ note }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:12px;font-weight:700;color:#0f6e56;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px\">{{ stepKicker }}<\u002Fdiv>\n            <div style=\"font-size:23px;font-weight:700;color:#102a43;line-height:1.25;margin-bottom:6px\">{{ stepTitle }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:#6b7280;margin-bottom:18px\">{{ stepHint }}<\u002Fdiv>\n\n            <sc-if value=\"{{ hasOpts }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px\">\n                <sc-for list=\"{{ opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">\n                    <div style=\"display:flex;gap:11px;align-items:flex-start\">\n                      <div style=\"{{ o.dot }}\"><\u002Fdiv>\n                      <div style=\"flex:1\">\n                        <div style=\"font-size:14.5px;font-weight:700;line-height:1.35;color:#1c1f23\">{{ o.l }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px;line-height:1.45;color:#6b7280;margin-top:3px\">{{ o.m }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isSearch }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px\">\n                <div style=\"display:flex;border:1.5px solid #0f6e56;border-radius:8px;background:#fff;overflow:hidden\">\n                  <input type=\"text\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"Search 400+ tests, e.g. vitamin D, ferritin, PSA\" style=\"flex:1;min-width:0;font:inherit;font-size:15px;padding:12px 13px;border:none;outline:none;background:transparent;color:#1c1f23\">\n                <\u002Fdiv>\n                <div style=\"border:1px solid #dfe0e0;border-radius:8px;margin-top:6px;max-height:250px;overflow-y:auto\">\n                  <sc-for list=\"{{ qMatches }}\" as=\"t\" hint-placeholder-count=\"6\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ t.toggle }}\" style=\"{{ t.style }}\"><span style=\"flex:1\">{{ t.name }}<\u002Fspan><span style=\"{{ t.badge }}\">{{ t.right }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#6b7280;margin-top:8px\">\n                  <span>{{ qNote }}<\u002Fspan>\n                  <span>Can't find it? Choose \"help me choose\" and ask the pharmacist.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hasRecs }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px\">\n                <div style=\"font-size:12px;font-weight:700;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px\">Suggested for you · add one or more<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\">\n                  <sc-for list=\"{{ recs }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div style=\"border:1px solid #dfe0e0;border-radius:10px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;background:#fff\">\n                      <div style=\"font-size:14.5px;font-weight:700;color:#102a43;line-height:1.3\">{{ r.n }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;line-height:1.45;color:#6b7280;flex:1\">{{ r.short }}<\u002Fdiv>\n                      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n                        <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:14px;font-weight:700\">{{ r.price }}<\u002Fspan><\u002Fsc-if>\n                        <button type=\"button\" sc-camel-on-click=\"{{ r.toggle }}\" style=\"{{ r.btnStyle }}\">{{ r.btnLabel }}<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#6b7280;margin-top:10px\">Not sure? Skip this and decide with the pharmacist at your appointment.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isPrep }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ prepLines }}\" as=\"pl\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:12px;align-items:flex-start;background:#f7f6f2;border-radius:10px;padding:13px 15px\">\n                    <div style=\"flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#0f6e56;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">✓<\u002Fdiv>\n                    <div><div style=\"font-size:14.5px;font-weight:700;color:#102a43\">{{ pl.t }}<\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:#4b5563;margin-top:2px\">{{ pl.d }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#e1f5ee;border:1px solid #b9e3d2;border-radius:12px;padding:18px 20px;margin-bottom:16px\">\n                <div style=\"font-size:15px;font-weight:700;color:#0c5c47;margin-bottom:4px\">{{ doneHead }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;line-height:1.55;color:#0c5c47\">{{ doneText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:16px\">\n                  <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#4b5563\">Full name<input type=\"text\" value=\"{{ fName }}\" sc-camel-on-change=\"{{ onName }}\" style=\"font:inherit;font-size:14.5px;padding:11px 12px;border:1.5px solid #dfe0e0;border-radius:8px;width:100%;color:#1c1f23;background:#fff\"><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#4b5563\">Date of birth<input type=\"date\" value=\"{{ fDob }}\" sc-camel-on-change=\"{{ onDob }}\" style=\"font:inherit;font-size:14.5px;padding:11px 12px;border:1.5px solid #dfe0e0;border-radius:8px;width:100%;color:#1c1f23;background:#fff\"><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#4b5563\">Mobile number<input type=\"tel\" value=\"{{ fPhone }}\" sc-camel-on-change=\"{{ onPhone }}\" style=\"font:inherit;font-size:14.5px;padding:11px 12px;border:1.5px solid #dfe0e0;border-radius:8px;width:100%;color:#1c1f23;background:#fff\"><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#4b5563\">Email<input type=\"email\" value=\"{{ fEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"font:inherit;font-size:14.5px;padding:11px 12px;border:1.5px solid #dfe0e0;border-radius:8px;width:100%;color:#1c1f23;background:#fff\"><\u002Flabel>\n                  <sc-if value=\"{{ isDirect }}\" hint-placeholder-val=\"{{ false }}\">\n                    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#4b5563\">Preferred date<input type=\"date\" value=\"{{ fDate }}\" min=\"{{ minDate }}\" sc-camel-on-change=\"{{ onDate }}\" style=\"font:inherit;font-size:14.5px;padding:11px 12px;border:1.5px solid #dfe0e0;border-radius:8px;width:100%;color:#1c1f23;background:#fff\"><\u002Flabel>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;font-weight:700;color:#4b5563;margin-bottom:6px\">{{ timeLabel }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">\n                  <sc-for list=\"{{ timeOpts }}\" as=\"to\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ to.pick }}\" style=\"{{ to.style }}\">{{ to.l }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#102a43;color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:16px\">\n                  <div style=\"font-size:16px;font-weight:700;margin-bottom:4px\">{{ sentHead }}<\u002Fdiv>\n                  <div style=\"font-size:13.5px;line-height:1.55;color:#c9d6e3\">{{ sentText }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"border:1px solid #dfe0e0;border-radius:10px;overflow:hidden;margin-bottom:18px\">\n                <sc-for list=\"{{ summary }}\" as=\"sm\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:11px 15px;border-bottom:1px solid #eeeeec;font-size:13.5px;line-height:1.45\">\n                    <div style=\"font-weight:700;color:#6b7280\">{{ sm.k }}<\u002Fdiv><div>{{ sm.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ showBwell }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1.5px dashed #5b3d8c;border-radius:10px;padding:14px 16px;margin-bottom:18px;background:#f6f2fb\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px\">\n                    <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5b3d8c\">For BeWell · how this arrives<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#5b3d8c\">Not shown to patients<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;line-height:1.5;color:#3d2a5e;margin-bottom:10px\">{{ bwellIntro }}<\u002Fdiv>\n                  <div style=\"background:#fff;border-radius:8px;overflow:hidden\">\n                    <sc-for list=\"{{ bwellRows }}\" as=\"bw\" hint-placeholder-count=\"8\">\n                      <div style=\"display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:8px 12px;border-bottom:1px solid #eee8f5;font-size:12.5px;line-height:1.45\">\n                        <div style=\"font-weight:700;color:#5b3d8c\">{{ bw.k }}<\u002Fdiv><div style=\"color:#1c1f23\">{{ bw.v }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"{{ submitStyle }}\">{{ bookLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <button type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"appearance:none;border:1px solid #dfe0e0;border-radius:6px;background:#fff;color:#102a43;font:inherit;font-size:14px;font-weight:600;padding:12px 16px;cursor:pointer\">Start again<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #eeeeec\">\n                <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"{{ backStyle }}\">Back<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 300px;max-width:100%;align-self:flex-start;background:#102a43;color:#fff;border-radius:14px;padding:22px 22px 20px;position:sticky;top:90px\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7fd3b4;margin-bottom:12px\">Your tests<\u002Fdiv>\n        <sc-if value=\"{{ basketEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:13.5px;line-height:1.55;color:#c9d6e3\">Nothing added yet. Add tests from the questions or the list below, or decide with the pharmacist.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ basket }}\" as=\"b\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid #1e4267\">\n              <div style=\"flex:1;font-size:14px;line-height:1.35\">{{ b.name }}<\u002Fdiv>\n              <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:14px;font-weight:700;white-space:nowrap\">{{ b.price }}<\u002Fdiv><\u002Fsc-if>\n              <button type=\"button\" sc-camel-on-click=\"{{ b.remove }}\" title=\"Remove\" style=\"appearance:none;border:none;background:none;color:#9fb3c8;font-size:17px;line-height:1;cursor:pointer;padding:0 2px\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showTotal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:space-between;margin-top:12px;font-size:15px;font-weight:700\"><span>Pay in store<\u002Fspan><span>{{ total }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#9fb3c8;margin-top:4px\">{{ totalNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showBasketCta }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ basketCta }}\" style=\"appearance:none;border:none;border-radius:6px;background:#0f6e56;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:12px 14px;cursor:pointer;width:100%;margin-top:14px\" style-hover=\"background:#0c5c47\">Continue to safety check<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #1e4267;display:flex;flex-direction:column;gap:7px;font-size:12.5px;line-height:1.5;color:#c9d6e3\">\n          <div>Bring photo ID: passport or driving licence.<\u002Fdiv>\n          <div>Analysed by our UKAS-accredited lab partner. We send you your results report, and can book a consultation to explain it if you'd like.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"tests\" style=\"max-width:1200px;margin:0 auto;padding:56px 24px 24px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n      <div>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f6e56;margin-bottom:10px\">Choose your test<\u002Fdiv>\n        <h2 style=\"font-size:34px;line-height:1.15;font-weight:700;color:#102a43;margin:0 0 10px\">What would you like to check?<\u002Fh2>\n        <div style=\"font-size:15px;line-height:1.55;color:#4b5563;max-width:560px\">Pick an area of health to see the tests we offer, what each one checks and the price. Not sure which to choose? <button type=\"button\" sc-camel-on-click=\"{{ goPhone }}\" style=\"appearance:none;border:none;background:none;font:inherit;color:#0f6e56;font-weight:700;cursor:pointer;padding:0;text-decoration:underline\">Request a phone consultation<\u002Fbutton> and we'll help.<\u002Fdiv>\n      <\u002Fdiv>\n      <input type=\"text\" value=\"{{ catQ }}\" sc-camel-on-change=\"{{ onCatQ }}\" placeholder=\"Search by test or marker, e.g. ferritin\" style=\"font:inherit;font-size:14px;padding:11px 13px;border:1.5px solid #dfe0e0;border-radius:8px;min-width:240px;color:#1c1f23\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px\">\n      <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px\">\n      <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"8\">\n        <div style=\"background:#fff;border:1px solid #dfe0e0;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;min-height:22px\">\n            <sc-for list=\"{{ p.tags }}\" as=\"tg\" hint-placeholder-count=\"1\">\n              <span style=\"font-size:11px;font-weight:700;padding:3px 8px;border-radius:100px;background:#f7f6f2;color:#4b5563\">{{ tg }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:16.5px;font-weight:700;color:#102a43;line-height:1.3\">{{ p.n }}<\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;gap:10px\">\n            <sc-if value=\"{{ p.hasD }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:13.5px;line-height:1.55;color:#4b5563\">{{ p.d }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div>\n              <div style=\"font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px\">{{ p.testsHead }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n                <sc-for list=\"{{ p.tests }}\" as=\"tt\" hint-placeholder-count=\"4\">\n                  <span style=\"font-size:11.5px;line-height:1.35;padding:3px 8px;border-radius:5px;background:#eef6f3;color:#0c5c47\">{{ tt }}<\u002Fspan>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ p.hasToggle }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.toggleTests }}\" style=\"appearance:none;border:none;background:none;font:inherit;font-size:11.5px;font-weight:700;color:#0f6e56;cursor:pointer;padding:3px 4px\">{{ p.toggleLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid #eeeeec\">\n            <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:19px;font-weight:700;color:#102a43\">{{ p.price }}<\u002Fdiv><\u002Fsc-if>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.toggle }}\" style=\"{{ p.btnStyle }}\">{{ p.btnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;justify-content:center;margin-top:22px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ showMore }}\" style=\"appearance:none;border:1.5px solid #102a43;border-radius:6px;background:#fff;color:#102a43;font:inherit;font-size:14px;font-weight:700;padding:12px 20px;cursor:pointer\" style-hover=\"background:#f7f6f2\">{{ moreLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noProducts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#f7f6f2;border-radius:10px;padding:18px 20px;font-size:14px;color:#4b5563\">No test matches that search. Try another word, or ask the pharmacist at your appointment.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div id=\"how\" style=\"max-width:1200px;margin:0 auto;padding:64px 24px 24px\">\n    <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f6e56;margin-bottom:10px\">How it works<\u002Fdiv>\n    <h2 style=\"font-size:34px;line-height:1.15;font-weight:700;color:#102a43;margin:0 0 26px\">From booking to results<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:#dfe0e0;border:1px solid #dfe0e0;border-radius:14px;overflow:hidden\">\n      <div style=\"background:#fff;padding:24px 22px\"><div style=\"font-size:30px;font-weight:700;color:#0f6e56;margin-bottom:10px\">1<\u002Fdiv><div style=\"font-size:16px;font-weight:700;margin-bottom:6px;color:#102a43\">Answer a few questions<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#4b5563\">Tell us if you know which test you want, or why you want a test. If you know your test, we also ask a few safety questions.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:24px 22px\"><div style=\"font-size:30px;font-weight:700;color:#0f6e56;margin-bottom:10px\">2<\u002Fdiv><div style=\"font-size:16px;font-weight:700;margin-bottom:6px;color:#102a43\">We book you in<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#4b5563\"><strong style=\"color:#102a43\">Know your test?<\u002Fstrong> Choose your branch and a date. We text you to confirm.<br><br><strong style=\"color:#102a43\">Not sure?<\u002Fstrong> Leave your number and we call you at the time you choose. We agree your tests and book you into your nearest branch.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:24px 22px\"><div style=\"font-size:30px;font-weight:700;color:#0f6e56;margin-bottom:10px\">3<\u002Fdiv><div style=\"font-size:16px;font-weight:700;margin-bottom:6px;color:#102a43\">Come to the pharmacy<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#4b5563\">Bring photo ID. You pay in store, then we take a small blood sample. It only takes a few minutes.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;padding:24px 22px\"><div style=\"font-size:30px;font-weight:700;color:#0f6e56;margin-bottom:10px\">4<\u002Fdiv><div style=\"font-size:16px;font-weight:700;margin-bottom:6px;color:#102a43\">Get your results<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#4b5563\">We send your sample to our UKAS-accredited lab partner. We then send you your results report and contact you if anything needs attention. If you'd like, we can book a consultation to explain your results.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"branches\" style=\"max-width:1200px;margin:0 auto;padding:64px 24px 24px\">\n    <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f6e56;margin-bottom:10px\">Where to go<\u002Fdiv>\n    <h2 style=\"font-size:34px;line-height:1.15;font-weight:700;color:#102a43;margin:0 0 22px\">Blood testing branches<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px\">\n      <sc-for list=\"{{ branchList }}\" as=\"br\" hint-placeholder-count=\"8\">\n        <div style=\"background:#f7f6f2;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-size:15.5px;font-weight:700;color:#102a43;line-height:1.3\">{{ br.n }}<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#4b5563;flex:1\">{{ br.a }}<\u002Fdiv>\n          <a href=\"{{ br.tel }}\" style=\"font-size:14px;font-weight:700;color:#0f6e56;text-decoration:none\">{{ br.p }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"faq\" style=\"max-width:860px;margin:0 auto;padding:64px 24px 72px\">\n    <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f6e56;margin-bottom:10px\">Questions<\u002Fdiv>\n    <h2 style=\"font-size:34px;line-height:1.15;font-weight:700;color:#102a43;margin:0 0 22px\">Frequently asked<\u002Fh2>\n    <div style=\"border-top:1px solid #dfe0e0\">\n      <div style=\"border-bottom:1px solid #dfe0e0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f0 }}\" style=\"appearance:none;border:none;background:none;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:#102a43;padding:18px 0;cursor:pointer\"><span>How long do results take?<\u002Fspan><span>{{ f0s }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f0o }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14.5px;line-height:1.65;color:#4b5563;padding:0 0 18px\">Most results are ready within one day of your sample reaching the lab. We'll send you your results report as soon as it's ready. If you'd like help understanding it, we can book a consultation to go through your results with you.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dfe0e0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f1 }}\" style=\"appearance:none;border:none;background:none;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:#102a43;padding:18px 0;cursor:pointer\"><span>Do I need to fast?<\u002Fspan><span>{{ f1s }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f1o }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14.5px;line-height:1.65;color:#4b5563;padding:0 0 18px\">Most tests don't need fasting. Some need a morning appointment (testosterone, cortisol), some need preparation (PSA) and some need timing to your cycle (progesterone). The \"Find your test\" questions tell you exactly what to do for the tests you choose.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dfe0e0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f2 }}\" style=\"appearance:none;border:none;background:none;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:#102a43;padding:18px 0;cursor:pointer\"><span>What should I bring?<\u002Fspan><span>{{ f2s }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f2o }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14.5px;line-height:1.65;color:#4b5563;padding:0 0 18px\">Photo ID: a passport or driving licence. We can't take a sample without it. Bring a list of any medicines you take, too.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dfe0e0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f3 }}\" style=\"appearance:none;border:none;background:none;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:#102a43;padding:18px 0;cursor:pointer\"><span>I feel unwell — should I book a test?<\u002Fspan><span>{{ f3s }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f3o }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14.5px;line-height:1.65;color:#4b5563;padding:0 0 18px\">If you have symptoms like chest pain, breathlessness, fainting, severe tummy pain or blood in your stools, please see a doctor today instead. Our questions check for this before you book, and the pharmacist will ask again at your appointment.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dfe0e0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f4 }}\" style=\"appearance:none;border:none;background:none;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:#102a43;padding:18px 0;cursor:pointer\"><span>Not good with needles?<\u002Fspan><span>{{ f4s }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f4o }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14.5px;line-height:1.65;color:#4b5563;padding:0 0 18px\">Tell us when you book. Our team will take their time, you can lie down if you prefer, and you're welcome to bring a friend for support.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dfe0e0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f5 }}\" style=\"appearance:none;border:none;background:none;width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;font:inherit;font-size:16px;font-weight:700;color:#102a43;padding:18px 0;cursor:pointer\"><span>How do I pay?<\u002Fspan><span>{{ f5s }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ f5o }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14.5px;line-height:1.65;color:#4b5563;padding:0 0 18px\">You pay in the pharmacy at your appointment, before the sample is taken.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#102a43;color:#c9d6e3\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:36px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:28px;font-size:13px;line-height:1.6\">\n      <div><div style=\"font-size:15px;font-weight:700;color:#fff;margin-bottom:8px\">Everest Pharmacy<\u002Fdiv><div>Unit 9, Avocado Court, Trafford Park, Manchester M17 1HW<\u002Fdiv><div>0161 413 3643 · support@everestpharmacy.co.uk<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:15px;font-weight:700;color:#fff;margin-bottom:8px\">Testing and results<\u002Fdiv><div>Samples are analysed by London Medical Laboratory, a UKAS-accredited laboratory registered with and regulated by the Care Quality Commission (certificate CRT1-4708702735).<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:15px;font-weight:700;color:#fff;margin-bottom:8px\">Feeling unwell?<\u002Fdiv><div>A blood test isn't a substitute for urgent care. Call 999 in an emergency, or NHS 111 for urgent advice.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showBwellPreview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Service&quot;},&quot;consultFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Service&quot;},&quot;showPrices&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Service&quot;}}\">\nconst PRODUCTS = [\n  {id:'general', n:'General Health Profile', code:'ML1', c:['general','mens','womens'], short:'Liver, kidneys, bone, iron, diabetes, cholesterol', d:'A broad check of your liver and kidneys, muscle and bone health, iron, diabetes (HbA1c) and a full cholesterol profile.', t:[]},\n  {id:'premier', n:'Premier General Health Profile', code:'ML2P', c:['general','mens','womens'], short:'General Health plus a full blood count', d:'Everything in the General Health Profile plus a full blood count — a good yearly baseline.', t:[]},\n  {id:'wellperson', n:'Well Person Premier Plus', code:'ML6', c:['general'], short:'Blood count, cholesterol, iron, liver, kidneys, thyroid', d:'A wide check for men and women: blood count, cholesterol, iron studies, liver, kidneys, bone, diabetes and thyroid.', t:[]},\n  {id:'wellman', n:'Well Man Premier Plus', code:'ML7', c:['general','mens'], short:'Our most complete check for men', d:'Wellness profile for men, adding thyroid, inflammation (hsCRP), vitamins and testosterone to a full health check.', t:['morning']},\n  {id:'wellwoman', n:'Well Woman Premier Plus', code:'ML8', c:['general','womens'], short:'Our most complete check for women', d:'Wellness profile for women, adding thyroid, inflammation (hsCRP), vitamins and female hormones to a full health check.', t:[]},\n  {id:'fatigue', n:'Tiredness / Fatigue Profile', code:'TP', c:['general','vitamins'], short:'Blood count, iron, vitamin D, thyroid, inflammation', d:'Looks for common causes of tiredness: full blood count, vitamin D, inflammation, iron, ferritin and thyroid function.', t:[]},\n  {id:'sports', n:'Sports Fitness Profile', code:'MLSB', c:['general'], short:'For starting or tracking a fitness programme', d:'Blood count, liver, kidneys, cholesterol, iron, CRP, vitamins D and B12, and testosterone.', t:['morning']},\n  {id:'cholesterol', n:'Cholesterol Lipid Profile', code:'LIP', c:['heart'], short:'Full cholesterol breakdown', d:'A complete picture of your cholesterol levels — the main blood test for heart attack and stroke risk.', t:[]},\n  {id:'heart', n:'Heart Health Profile', code:'HHP', c:['heart'], short:'Cholesterol, HbA1c and CRP', d:'Three of the most important heart risks in one test: full cholesterol profile, diabetes (HbA1c) and inflammation (CRP).', t:[]},\n  {id:'hba1c', n:'Diabetes Check (HbA1c)', code:'GHB', c:['heart','mens','womens'], short:'Diagnose or monitor diabetes', d:'HbA1c is the standard test for diagnosing diabetes or checking how well it is controlled. No fasting needed.', t:[]},\n  {id:'thyroid', n:'Thyroid Function', code:'TF', c:['hormones','womens','general'], short:'TSH and free T4', d:'Checks how well your thyroid is working. Low thyroid can cause tiredness, weight gain, thinning hair and low mood.', t:[]},\n  {id:'thyroidfull', n:'Thyroid Full Profile', code:'TF2', c:['hormones','womens'], short:'TSH, FT3, FT4 and thyroid antibodies', d:'A full thyroid check including antibodies, which show the most common causes of thyroid problems.', t:[]},\n  {id:'iron', n:'Iron Status Profile', code:'ISP', c:['vitamins'], short:'Iron, ferritin, transferrin saturation', d:'Shows whether your iron stores are low, or too high — both can cause health problems.', t:[]},\n  {id:'vitd', n:'Vitamin D', code:'VTD', c:['vitamins'], short:'Vitamin D level', d:'Checks your vitamin D level, which many people in the UK are low in over winter.', t:[]},\n  {id:'b12', n:'Vitamin B12', code:'B12', c:['vitamins'], short:'Vitamin B12 level', d:'Checks your vitamin B12, which is important for energy, nerves and making red blood cells.', t:[]},\n  {id:'vitprofile', n:'Vitamin Profile', code:'VP', c:['vitamins'], short:'Vitamin D, B12 and folate', d:'Checks vitamin D, vitamin B12 and folate together.', t:[]},\n  {id:'testo', n:'Testosterone Check', code:'TEST', c:['mens','hormones'], short:'Total testosterone', d:'Testosterone matters for libido, fertility, muscle, bone and mood. Important if you take testosterone supplements.', t:['morning']},\n  {id:'testoplus', n:'Testosterone Plus Profile', code:'TESTP', c:['mens','hormones'], short:'Total and free testosterone', d:'Total and free (available) testosterone for a fuller picture of your levels.', t:['morning']},\n  {id:'malehorm', n:'Male Hormone Profile', code:'MHP', c:['mens','hormones'], short:'Testosterone, SHBG, FSH, LH, prolactin and more', d:'All the key male hormones: testosterone, free testosterone, DHEAS, SHBG, FSH, LH, oestradiol, prolactin and free androgen index.', t:['morning']},\n  {id:'prostate', n:'Prostate Profile (PSA)', code:'PR2', c:['mens'], short:'PSA, free PSA and ratio', d:'One way to check prostate health. PSA alone can\\'t diagnose cancer, so abnormal
